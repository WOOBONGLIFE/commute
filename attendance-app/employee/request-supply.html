<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>비품 요청</title>

  <link rel="stylesheet" href="../public/css/common.css" >
  <link rel="stylesheet" href="../public/css/mobile.css" >
  <link rel="stylesheet" href="../public/css/request.css" >
</head>

<body
  data-request-type="supply_request"
  data-lead-only="true"
>
  <div class="phone">
    <header class="request-page-header">
      <button
        class="request-back"
        type="button"
        onclick="history.back()"
      >
        ‹
      </button>

      <h1>비품 요청</h1>
    </header>

    <main class="request-form-main">
      <form
        id="simpleRequestForm"
        class="request-form-card"
      >
        <label>
          필요 비품

          <input
            id="requestTitle"
            type="text"
            required
            maxlength="100"
            placeholder="예: 쓰레기봉투 100L"
          >
        </label>

        <label>
          수량 및 요청 사유

          <textarea
            id="requestContent"
            required
            maxlength="1000"
            placeholder="필요 수량과 요청 사유를 입력해 주세요."
          ></textarea>
        </label>

        <section class="request-image-section">
          <div class="request-image-title">
            <div>
              <strong>사진 첨부</strong>
              <small>선택 사항 · 최대 1장</small>
            </div>
          </div>

          <label
            class="request-image-picker"
            for="requestImage"
          >
            <span class="request-image-icon">＋</span>
            <strong>사진 선택하기</strong>
            <small>
              카메라로 촬영하거나 사진을 선택할 수 있습니다.
            </small>
          </label>

          <input
            id="requestImage"
            class="request-image-input"
            type="file"
            accept="image/jpeg,image/png,image/webp"
          >

          <div
            id="requestImagePreviewBox"
            class="request-image-preview-box"
            hidden
          >
            <img
              id="requestImagePreview"
              alt="첨부 사진 미리보기"
            >

            <div class="request-image-preview-info">
              <span id="requestImageName"></span>

              <button
                id="removeRequestImageBtn"
                type="button"
              >
                사진 삭제
              </button>
            </div>
          </div>
        </section>

        <button
          class="request-submit"
          type="submit"
        >
          비품 요청 보내기
        </button>
      </form>
    </main>
  </div>

  <script type="module" src="../public/js/request-simple.js?v=39" ></script>
</body>
</html>
