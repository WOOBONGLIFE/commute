<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>내 정보</title>

  <meta name="theme-color" content="#171717" >
  <link rel="manifest" href="./manifest.json" >
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/app-icon-192.png" >
  <link rel="apple-touch-icon" href="./icons/app-icon-192.png" >

  <link rel="stylesheet" href="../public/css/common.css" />
  <link rel="stylesheet" href="../public/css/mobile.css" />
  <link rel="stylesheet" href="../public/css/mypage.css" />
</head>

<body data-page="mypage">
  <div class="phone">
    <header class="mypage-header">
      <div>
        <p class="page-label">MY PAGE</p>
        <h1>내 정보</h1>
      </div>

      <button id="fontToggleBtn" class="font-size-btn" type="button" aria-label="글자 크기 조절">
        <span class="font-icon">A+</span>
        <span class="font-text">글자 크게</span>
      </button>
    </header>

    <main class="mypage-main">
      <section class="profile-card">
        <div class="profile-info">
          <h2 id="employeeName">직원</h2>
          <p id="employeeTeam">소속 미지정</p>
        </div>

        <div class="profile-list">
          <div class="profile-item">
            <span>연락처</span>
            <strong id="employeePhone">-</strong>
          </div>

          <div class="profile-item">
            <span>등록일</span>
            <strong id="employeeJoinDate">-</strong>
          </div>

          <div class="profile-item">
            <span>직급</span>
            <strong id="employeeAppRole">직급 미지정</strong>
          </div>
        </div>
      </section>

      <section class="mypage-card">
        <div class="section-title-row">
          <div>
            <p class="section-label">WORK AREA</p>
            <h2>배정 근무지역</h2>
          </div>
        </div>

        <div id="regionList" class="region-list">
          <span class="region-chip empty">근무지역을 불러오는 중입니다.</span>
        </div>

        <p class="card-guide">
          배정된 근무지역 안에서만 출퇴근 체크가 가능합니다.
        </p>
      </section>

      <section class="mypage-card">
        <div class="section-title-row">
          <div>
            <p class="section-label">ACCOUNT</p>
            <h2>계정 관리</h2>
          </div>
        </div>

        <div class="menu-list">
          <button id="editPhoneBtn" class="menu-item" type="button">
            <div>
              <strong>연락처 변경 요청</strong>
              <p>관리자에게 연락처 변경을 요청합니다.</p>
            </div>

            <span>›</span>
          </button>

          <button id="infoRequestBtn" class="menu-item" type="button">
            <div>
              <strong>내 정보 변경 요청</strong>
              <p>이름, 소속, 근무지역 변경을 요청합니다.</p>
            </div>

            <span>›</span>
          </button>
        </div>
      </section>

      <section class="mypage-card">
        <div class="section-title-row">
          <div>
            <p class="section-label">
              APP SETTING
            </p>

            <h2>
              앱 설정
            </h2>
          </div>
        </div>

        <div class="setting-list">
          <button
            id="locationSettingBtn"
            class="setting-item"
            type="button"
          >
            <div>
              <strong>
                위치 권한
              </strong>

              <p>
                출퇴근 체크를 위해 위치 권한이 필요합니다.
              </p>
            </div>

            <span
              id="locationPermission"
              class="permission-badge denied"
            >
              확인 필요
            </span>
          </button>

          <label class="setting-item">
            <div>
              <strong>
                알림 설정
              </strong>

              <p>
                공지사항과 요청 처리 결과 알림을 받습니다.
              </p>
            </div>

            <span class="switch">
              <input
                id="notificationToggle"
                type="checkbox"
              >

              <span></span>
            </span>
          </label>

          <button
            id="installAppBtn"
            class="setting-item"
            type="button"
          >
            <div>
              <strong>
                홈 화면에 앱 설치
              </strong>

              <p id="installAppDescription">
                휴대폰 홈 화면에서 앱처럼 바로 실행합니다.
              </p>
            </div>

            <span
              id="installAppStatus"
              class="permission-badge pending"
            >
              설치 안내
            </span>
          </button>
        </div>
      </section>

      <button id="logoutButton" class="logout-button" type="button">
        로그아웃
      </button>
    </main>

    <div id="bottomNav"></div>
  </div>


<script src="../public/js/common.js"></script>
<script src="../public/js/mobile.js"></script>
<script src="../public/js/pwa-register.js?v=44"></script>
<script type="module" src="../public/js/mypage.js?v=38" ></script>

</body>
</html>
