<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>직원 홈</title>

  <meta name="theme-color" content="#171717" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/app-icon.svg" />

  <link rel="stylesheet" href="../public/css/common.css" />
  <link rel="stylesheet" href="../public/css/mobile.css?v=44" />
  <link rel="stylesheet" href="../public/css/index.css?v=48" />
</head>
<body data-page="index">
  <div class="phone">
    <header class="home-header">
      <div>
        <p id="todayDate" class="today-date"></p>
        <h1>안녕하세요, <strong id="userName">직원</strong> 님</h1>
      </div>

      <button id="fontToggleBtn" class="font-size-btn" type="button" aria-label="글자 크기 조절">
        <span class="font-icon">A+</span>
        <span class="font-text">글자 크게</span>
      </button>    </header>

    <main class="home-main">
      <section class="location-card">
        <div class="location-icon">📍</div>

        <div class="location-info">
          <p>위치 확인 상태</p>

          <strong id="locationStatusText">
            현재 위치를 확인하고 있습니다.
          </strong>
        </div>

        <span
          id="locationStatusBadge"
          class="status-badge neutral"
        >
          확인 중
        </span>
      </section>

      <section class="work-card">
        <div class="section-title-row">
          <div>
            <p class="section-label">TODAY</p>
            <h2>오늘 근무 현황</h2>
          </div>

          <span id="workStatus" class="status-badge neutral">출근 전</span>
        </div>

        <div class="time-grid">
          <div class="time-box">
            <p>출근 시간</p>
            <strong id="checkInTime">--:--</strong>
          </div>

          <div class="time-box">
            <p>퇴근 시간</p>
            <strong id="checkOutTime">--:--</strong>
          </div>
        </div>

        <button id="attendanceBtn" class="attendance-button" type="button">
          <span class="button-icon">✓</span>
          <span id="buttonText">출근하기</span>
        </button>

        <p class="work-guide">
          지정된 근무 지역 안에서만 출퇴근 체크가 가능합니다.
        </p>
      </section>

      <section class="notice-card">
        <div class="section-title-row">
          <div>
            <p class="section-label">NOTICE</p>
            <h2>공지사항</h2>
          </div>

          <button
            id="noticeMoreBtn"
            class="more-button"
            type="button"
          >
            전체보기
          </button>
        </div>

        <div id="homeNoticeList">
          <article class="notice-item">
            <div class="notice-icon">🔔</div>

            <div>
              <p class="notice-text">
                공지사항을 불러오는 중입니다.
              </p>
            </div>
          </article>
        </div>
      </section>
    </main>
    <div id="bottomNav"></div>
  </div>

  <script src="../public/js/common.js"></script>
  <script src="../public/js/mobile.js?v=44"></script>
  <script type="module" src="../public/js/index.js?v=56"></script>
</body>
</html>
