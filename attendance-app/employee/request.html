<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>요청</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="../public/css/common.css" />
  <link rel="stylesheet" href="../public/css/mobile.css" />
  <link rel="stylesheet" href="../public/css/request.css?v=30" />
</head>

<body data-page="request">
  <div class="phone">
    <header class="request-header">
      <div>
        <p>REQUEST</p>
        <h1>요청</h1>
      </div>

      <button id="fontToggleBtn" class="font-size-btn" type="button" >
        A+ 글자 크게
      </button>
    </header>

    <main class="request-main">
      <p class="request-guide">
        필요한 업무를 선택해 주세요.
      </p>

      <section class="request-grid">
        <a
          class="request-menu-card lead-only"
          href="./cleaning-checklist.html"
        >
          <span class="request-menu-icon">
            ✓
          </span>

          <strong>
            청소 점검표
          </strong>

          <p>
            항목별 상태를 불량·보통·양호로 평가합니다.
          </p>

          <small>
            팀장 전용
          </small>
        </a>

        <a
          class="request-menu-card lead-only"
          href="./request-supply.html"
        >
          <span class="request-menu-icon">
            ▣
          </span>

          <strong>
            비품 요청
          </strong>

          <p>
            현장에 필요한 비품과 수량을 요청합니다.
          </p>

          <small>
            팀장 전용
          </small>
        </a>

        <a
          class="request-menu-card"
          href="./request-general.html"
        >
          <span class="request-menu-icon">
            ✎
          </span>

          <strong>
            요청 사항
          </strong>

          <p>
            관리자에게 요청이나 건의사항을 전달합니다.
          </p>
        </a>

        <a
          class="request-menu-card"
          href="./request-leave.html"
        >
          <span class="request-menu-icon">
            ○
          </span>

          <strong>
            연차 신청
          </strong>

          <p>
            연차 날짜와 신청 사유를 작성합니다.
          </p>
        </a>
      </section>

      <a
        class="request-history-link"
        href="./my-submissions.html"
      >
        <span class="request-history-icon">
          ≡
        </span>

        <span class="request-history-text">
          <strong>
            내 제출내역
          </strong>

          <small>
            요청 및 청소 점검표 처리 결과 확인
          </small>
        </span>

        <span class="request-history-arrow">
          ›
        </span>
      </a>
    </main>

    <div id="bottomNav"></div>

  </div>

  <script src="../public/js/common.js"></script>
  <script src="../public/js/mobile.js"></script>
  <script type="module" src="../public/js/request.js?v=32" ></script>
</body>
</html>
