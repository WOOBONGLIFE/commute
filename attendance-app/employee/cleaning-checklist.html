<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>청소 점검표</title>

  <link rel="stylesheet" href="../public/css/common.css" >
  <link rel="stylesheet" href="../public/css/mobile.css" >
  <link rel="stylesheet" href="../public/css/request.css" >
  <link rel="stylesheet" href="../public/css/cleaning-checklist.css?v=30" >
</head>

<body>
  <div class="phone">
    <header class="request-page-header">
      <button
        class="request-back"
        type="button"
        onclick="history.back()"
      >
        ‹
      </button>

      <h1>청소 점검표</h1>
    </header>

    <main class="request-form-main">
      <section class="request-form-card">
        <label>
          점검 현장

          <select id="checklistWorkplace">
          </select>
        </label>

        <div class="inline-add">
          <input
            id="customChecklistInput"
            type="text"
            maxlength="100"
            placeholder="개인 점검 항목 추가"
          >

          <button
            id="addChecklistItemBtn"
            type="button"
          >
            추가
          </button>
        </div>
        <p class="checklist-rating-guide">
          각 점검 항목의 상태를 선택해 주세요.
        </p>

        <div
          id="checklistList"
          class="checklist-list"
        ></div>

        <label>
          점검 메모

          <textarea
            id="checklistNote"
            maxlength="1000"
            placeholder="특이사항이 있을 때 입력해 주세요."
          ></textarea>
        </label>

        <section class="checklist-photo-section">
          <div class="checklist-photo-header">
            <div>
              <strong>현장 사진</strong>

              <p>
                여러 장을 한 번에 선택할 수 있습니다.
              </p>
            </div>

            <span id="checklistPhotoCount">
              0/20
            </span>
          </div>

          <label
            class="checklist-photo-picker"
            for="checklistPhotoInput"
          >
            <span>＋</span>

            <strong>
              현장 사진 추가
            </strong>

            <small>
              최대 20장 · 사진은 자동으로 압축됩니다.
            </small>
          </label>

          <input
            id="checklistPhotoInput"
            class="checklist-photo-input"
            type="file"
            accept="image/jpeg,image/png,image/webp"
            multiple
          >

          <div
            id="checklistPhotoList"
            class="checklist-photo-list"
          ></div>
        </section>

        <div
          id="checklistUploadProgress"
          class="checklist-upload-progress"
          hidden
        >
          <div class="checklist-upload-progress-top">
            <strong>
              사진 업로드 중
            </strong>

            <span id="checklistUploadProgressText">
              0/0
            </span>
          </div>

          <div class="checklist-upload-progress-track">
            <span id="checklistUploadProgressBar"></span>
          </div>

          <p>
            업로드가 끝날 때까지 화면을 닫지 마세요.
          </p>
        </div>

        <button
          id="submitChecklistBtn"
          class="request-submit"
          type="button"
        >
          점검 결과 제출
        </button>
      </section>
    </main>
  </div>

  <script type="module" src="../public/js/cleaning-checklist.js?v=31" ></script>
</body>
</html>
