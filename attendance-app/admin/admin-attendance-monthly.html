<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1,
      viewport-fit=cover
    "
  >

  <title>월간 출근부 | 근태관리 Admin</title>

  <link rel="stylesheet" href="../public/css/common.css" />
  <link rel="stylesheet" href="../public/css/pc.css" />
  <link rel="stylesheet" href="../public/css/admin.css" />
  <link rel="stylesheet" href="../public/css/admin-attendance.css" />
</head>

<body data-admin-page="attendance-monthly">
  <div class="admin-layout">
    <div id="adminSidebar"></div>

    <main class="main">
      <header class="top-header">
        <div>
          <h2>월간 출근부</h2>
          <p>직원별 월간 출근 기록과 메모를 확인합니다.</p>
        </div>

        <div class="header-actions">
          <button class="download-button" type="button" id="monthlyDownloadBtn">
            <span>⬇</span>
            엑셀 다운로드
          </button>
        </div>
      </header>

        <section class="content">
          <section class="attendance-sub-tabs">
            <a
              href="admin-attendance.html"
              class="attendance-sub-tab"
            >
              오늘 출퇴근 현황
            </a>

            <a
              href="admin-attendance-issue.html"
              class="attendance-sub-tab"
            >
              지각·미출근 관리
            </a>

            <a
              href="admin-attendance-monthly.html"
              class="attendance-sub-tab active"
            >
              월간 출근부
            </a>

            <a
              href="admin-attendance-edit.html"
              class="attendance-sub-tab"
            >
              출퇴근 기록 수정
            </a>
          </section>

          <section class="monthly-filter-panel">
            <div class="monthly-filter-group">
              <label>
                조회 월

                <input
                  type="month"
                  id="monthFilter"
                />
              </label>

              <label>
                근무지

                <select id="monthlyWorkplaceFilter">
                  <option value="all">
                    전체 근무지
                  </option>
                </select>
              </label>

              <label class="monthly-search-label">
                직원 검색

                <input
                  type="search"
                  id="monthlySearchInput"
                  placeholder="이름, 소속, 근무지 검색"
                />
              </label>
            </div>
          </section>

          <section class="stats-grid monthly-summary-grid">
            <article class="stat-card">
              <p>이번 달 출근 직원</p>

              <strong id="summaryEmployeeCount">
                0
              </strong>

              <span>명</span>
            </article>

            <article class="stat-card">
              <p>전체 출근 기록</p>

              <strong id="summaryAttendanceCount">
                0
              </strong>

              <span>일</span>
            </article>

            <article class="stat-card warning">
              <p>지각</p>

              <strong id="summaryLateCount">
                0
              </strong>

              <span>회</span>
            </article>

            <article class="stat-card annual-leave-stat">
              <p>연차 사용자</p>

              <strong id="summaryLeaveEmployeeCount">
                0
              </strong>

              <span>명</span>
            </article>

            <article class="stat-card dark">
              <p>연차 사용일</p>

              <strong id="summaryLeaveDayCount">
                0
              </strong>

              <span>일</span>
            </article>
          </section>

          <section class="monthly-view-tabs">
            <button
              type="button"
              class="monthly-view-tab active"
              data-monthly-view="attendance"
            >
              이번 달 출근 직원

              <span id="attendanceEmployeeBadge">
                0
              </span>
            </button>

            <button
              type="button"
              class="monthly-view-tab"
              data-monthly-view="leave"
            >
              연차 사용자

              <span id="leaveEmployeeBadge">
                0
              </span>
            </button>
          </section>

          <section class="monthly-print-panel">
            <div class="monthly-print-heading">
              <div>
                <h3>월간 출근부 출력</h3>

                <p>
                  직원별 또는 현장별 월간 출근부를 선택하여 출력합니다.
                </p>
              </div>
            </div>

            <div class="monthly-print-options">
              <div class="monthly-print-option">
                <label>
                  직원별 출력

                  <input
                    type="search"
                    id="employeePrintSearchInput"
                    placeholder="직원 이름 검색"
                    autocomplete="off"
                  />

                  <select id="employeePrintSelect">
                    
                    <option value="">
                      직원을 선택하세요
                    </option>
                  </select>
                </label>

                <button
                  type="button"
                  id="employeeMonthlyPrintBtn"
                >
                  직원 출근부 출력
                </button>
              </div>

              <div class="monthly-print-option">
                <label>
                  현장별 출력

                  <select id="workplacePrintSelect">
                    <option value="">
                      현장을 선택하세요
                    </option>
                  </select>
                </label>

                <button
                  type="button"
                  id="workplaceMonthlyPrintBtn"
                >
                  현장 출근부 출력
                </button>
              </div>
            </div>
          </section>

          <section class="panel monthly-employee-panel">
            <div class="panel-header monthly-employee-heading">
              <div>
                <h3 id="monthlyEmployeeTableTitle">
                  이번 달 출근 직원
                </h3>

                <p id="monthlyEmployeeTableDescription">
                  선택한 달에 실제 출근 기록이 있는 직원만 표시됩니다.
                </p>
              </div>

              <span id="monthlyResultCount">
                0명
              </span>
            </div>

            <div class="attendance-table-wrap monthly-employee-table-wrap">
              <table class="attendance-table monthly-employee-table">
                <thead>
                  <tr>
                    <th>직원</th>
                    <th>소속</th>
                    <th>근무지</th>
                    <th>출근일수</th>
                    <th>지각</th>
                    <th>연차</th>
                    <th>총 근무시간</th>
                    <th>최근 출근일</th>
                    <th>관리</th>
                  </tr>
                </thead>

                <tbody id="monthlyEmployeeTableBody">
                  <tr>
                    <td
                      colspan="9"
                      class="empty-table-cell"
                    >
                      월간 출근 정보를 불러오는 중입니다.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </section>
    </main>
  </div>

  <script src="../public/js/common.js"></script>
  <script type="module" src="../public/js/pc.js"></script>
  <script type="module" src="../public/js/admin-attendance-monthly.js?v=55"></script>
</body>
</html>
